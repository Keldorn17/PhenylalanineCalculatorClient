@if (isLoggedIn()) {
  <button
    mat-icon-button
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin"
    (click)="toggleMenu()"
    [attr.aria-label]="'login.userSettings' | translate"
  >
    <mat-icon>person</mat-icon>
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="isOpen()"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    [cdkConnectedOverlayPositions]="positions"
    (backdropClick)="closeMenu()"
    (detach)="closeMenu()"
    (overlayKeydown)="onOverlayKeydown($event)"
  >
    <div class="floating-panel mat-shadow-3">
      @if (currentView() === 'main') {
        <div class="menu-section">
          <button class="menu-item" (click)="changeUsername()">
            <mat-icon class="item-icon">manage_accounts</mat-icon>
            <span class="item-label">{{ 'settings.changeUsername' | translate }}</span>
          </button>

          <button class="menu-item" (click)="changePassword()">
            <mat-icon class="item-icon">lock_reset</mat-icon>
            <span class="item-label">{{ 'settings.changePassword' | translate }}</span>
          </button>
        </div>

        <mat-divider></mat-divider>

        <div class="menu-section">
          <button class="menu-item" (click)="openLanguageView()">
            <mat-icon class="item-icon">translate</mat-icon>
            <span class="item-label">{{ 'settings.language' | translate }}</span>
            <span class="item-value">{{ (currentLang() === 'en' ? 'language.english' : 'language.hungarian') | translate }}</span>
            <mat-icon class="chevron-icon">chevron_right</mat-icon>
          </button>

          <button class="menu-item" (click)="toggleTheme()">
            <mat-icon class="item-icon">{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
            <span class="item-label">{{ (isDark() ? 'settings.themeLight' : 'settings.themeDark') | translate }}</span>
          </button>
        </div>
      } @else if (currentView() === 'language') {
        <div class="menu-header">
          <button mat-icon-button (click)="backToMainView()" [attr.aria-label]="'Back'">
            <mat-icon>arrow_back</mat-icon>
          </button>
          <span class="header-title">{{ 'settings.language' | translate }}</span>
        </div>
        <mat-divider></mat-divider>
        <div class="menu-section">
          @for (lang of languages; track lang.code) {
            <button class="menu-item" (click)="setLanguage(lang.code)">
              <mat-icon class="check-icon" [style.visibility]="currentLang() === lang.code ? 'visible' : 'hidden'">check</mat-icon>
              <span class="item-label">{{ lang.label | translate }}</span>
            </button>
          }
        </div>
      }
    </div>
  </ng-template>
} @else {
  <a mat-button routerLink="/login" class="sign-in-btn">
    <mat-icon>login</mat-icon>
    <span>{{ 'login.signIn' | translate }}</span>
  </a>
}
