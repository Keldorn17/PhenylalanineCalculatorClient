<div class="login-container">
  <div class="login-card">
    <div class="header">
      <h2>Phenylalanine Calculator</h2>
      <p class="subtitle">Authentication Portal</p>
    </div>

    @if (!authService.isAuthenticated()) {
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="form">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="username"
            required
            placeholder="Enter your username"
            [disabled]="isLoading()"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            required
            placeholder="Enter your password"
            [disabled]="isLoading()"
          />
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="isLoading() || !loginForm.form.valid">
          @if (isLoading()) {
            <span>Authenticating...</span>
          } @else {
            <span>Sign In</span>
          }
        </button>
      </form>
    } @else {
      <div class="authenticated-state">
        <div class="status-indicator">
          <span class="dot green"></span>
          <span>Logged In</span>
        </div>

        <div class="token-display">
          <strong>Access Token (Truncated):</strong>
          <code>{{ authService.accessToken() | slice:0:30 }}...</code>
        </div>

        <div class="action-grid">
          <button (click)="fetchFoodType()" class="btn btn-secondary" [disabled]="isLoading()">
            Fetch Food Type 1
          </button>

          <button (click)="onRefresh()" class="btn btn-info" [disabled]="isLoading()">
            Force Token Refresh
          </button>

          <button (click)="onLogout()" class="btn btn-danger" [disabled]="isLoading()">
            Logout
          </button>
        </div>
      </div>
    }

    @if (errorMessage()) {
      <div class="alert alert-error">
        {{ errorMessage() }}
      </div>
    }

    @if (successMessage()) {
      <div class="alert alert-success">
        {{ successMessage() }}
      </div>
    }
  </div>
</div>
